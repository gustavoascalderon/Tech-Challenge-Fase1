[project]
name = "tech-challenge-fase1"
version = "0.1.0"
description = "Rede Neural para Previsão de Churn com Pipeline Profissional End-to-End"
readme = "README.md"
requires-python = ">=3.10"
# Lista de dependências obrigatórias citadas no PDF do desafio
dependencies = [
    "torch>=2.0.0",          # Construção e treinamento da rede neural (MLP)
    "scikit-learn>=1.2.0",   # Pipelines de pré-processamento e modelos baseline
    "mlflow>=2.0.0",         # Tracking de experimentos (parâmetros, métricas e artefatos)
    "fastapi>=0.95.0",       # API de inferência do modelo
    "uvicorn>=0.22.0",       # Servidor para a API FastAPI
    "pydantic>=2.0.0",       # Validação de dados na API 
    "pandera>=0.15.0",       # Validação de schema de dados (tests) 
    "pytest>=7.0.0",         # Framework de testes automatizados 
    "ruff>=0.1.0",           # Linting para garantir código limpo e sem erros 
    "pandas>=2.0.0",         # Manipulação de dados
    "numpy>=1.24.0",         # Operações matemáticas
]

[tool.ruff]
# Configuração do Linter para manter o código organizado 
line-length = 88
select = ["E", "F", "I"] # Ativa regras de erro, estilo e importação
ignore = []

[tool.pytest.ini_options]
# Configuração para que o pytest encontre os seus testes na pasta correta 
testpaths = ["tests"]
python_files = "test_*.py"