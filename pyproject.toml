[project]
name = "tech-challenge-fase1"
version = "0.1.0"
description = "Rede Neural para Previsão de Churn com Pipeline Profissional End-to-End"
readme = "README.md"
requires-python = ">=3.10"
# Lista de dependências obrigatórias citadas no PDF do desafio
dependencies = [
    "torch>=2.0.0",          # Construção e treinamento da rede neural (MLP) [cite: 28]
    "scikit-learn>=1.2.0",   # Pipelines de pré-processamento e modelos baseline [cite: 29, 30]
    "mlflow>=2.0.0",         # Tracking de experimentos (parâmetros, métricas e artefatos) [cite: 31]
    "fastapi>=0.95.0",       # API de inferência do modelo [cite: 32]
    "uvicorn>=0.22.0",       # Servidor para a API FastAPI
    "pydantic>=2.0.0",       # Validação de dados na API [cite: 57]
    "pandera>=0.15.0",       # Validação de schema de dados (tests) [cite: 57]
    "pytest>=7.0.0",         # Framework de testes automatizados [cite: 17, 57]
    "ruff>=0.1.0",           # Linting para garantir código limpo e sem erros [cite: 39]
    "pandas>=2.0.0",         # Manipulação de dados
    "numpy>=1.24.0",         # Operações matemáticas
]

[tool.ruff]
# Configuração do Linter para manter o código organizado [cite: 39]
line-length = 88
select = ["E", "F", "I"] # Ativa regras de erro, estilo e importação
ignore = []

[tool.pytest.ini_options]
# Configuração para que o pytest encontre os seus testes na pasta correta [cite: 16]
testpaths = ["tests"]
python_files = "test_*.py"