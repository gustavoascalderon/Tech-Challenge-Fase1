[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "churn-prediction"
version = "0.1.0"
description = "Previsão de churn de clientes de telecomunicações com MLP (PyTorch)"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "mlflow>=2.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "imbalanced-learn>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pandera>=0.18",
    "httpx>=0.27",   # para testar FastAPI
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["src"]
